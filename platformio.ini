; ==============================================================================
; PlatformIO Configuration File
; Project: Secure IoT Wake-on-LAN Micro-Agent (ESP8266 / NodeMCU)
; ==============================================================================

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; Serial Monitor & Upload configuration
monitor_speed = 115200
upload_speed = 921600

; Build flags:
; - MQTT_MAX_PACKET_SIZE: Ensures full telemetry / auth messages fit inside buffer
; - DNDEBUG: Strips debug asserts in production builds
build_flags = 
    -D MQTT_MAX_PACKET_SIZE=512
    -Wall

; External Library Dependencies
lib_deps =
    knolleary/PubSubClient @ ^2.8
    tzapu/WiFiManager @ ^0.16.0
